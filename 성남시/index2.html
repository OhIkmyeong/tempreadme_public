<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>성남시 카피</title>
    <link rel="stylesheet" href="./style2.css">
</head>
<body>
    <section class="top">
        <article class="top-slide">
            <h1 class="title">슬라이드</h1>
            <div class="box"></div>
        </article>
        <article class="top-other">
            <h1 class="title">다른 영역</h1>
            <div class="box"></div>
            <div class="box"></div>
        </article>
        <article class="top-btns">
            <h1 class="title">버튼 메뉴</h1>
            <div class="box"></div>
        </article>
    </section>
    <section class="btm">
        <article class="btm-board">
            <h1 class="title">게시판</h1>
            <ul class="board box">
                <li class="board-item">1</li>
                <li class="board-item">2</li>
                <li class="board-item">3</li>
                <li class="board-item">4</li>
                <li class="board-item">5</li>
            </ul>
        </article>
        <article class="btm-popup">
            <h1 class="title">팝업존</h1>
            <div class="box"></div>
        </article>
    </section>
</body>
</html>
